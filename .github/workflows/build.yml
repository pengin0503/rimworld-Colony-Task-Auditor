name: Validate and build (RimWorld 1.7 development)
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Validate mod metadata and translations
        run: python3 tools/validate_package.py
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Progress regression tests
        run: dotnet run --project Tests/Tests.csproj -c Release
      - name: Restore public reference assemblies
        run: dotnet restore Source/ColonyTaskAuditor.csproj
      - name: Compile (no game files distributed)
        run: dotnet build Source/ColonyTaskAuditor.csproj --configuration Release --no-restore
      - name: Compile real-game fixtures (compile only, not runtime validation)
        run: dotnet build Tests.Game/Tests.Game.csproj -c Release
      - name: Package development mod
        run: python3 tools/package_dev.py
      - uses: actions/upload-artifact@v4
        with:
          name: ColonyTaskAuditor-development-dll
          path: dist/ColonyTaskAuditor-development.zip
          if-no-files-found: error
          retention-days: 7

